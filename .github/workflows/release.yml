name: Versioned release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  NODE_VERSION: 26.5.0

jobs:
  release:
    name: Build and publish release asset
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: |
          npm run lint
          npm run test:unit
          npm run test:knowledge
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Assemble release bundle
        id: bundle
        run: |
          release_tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$release_tag" in v*) ;; *) echo "Release tag must start with v" >&2; exit 1;; esac
          mkdir -p release/finanzas-os
          cp -R dist server public release/finanzas-os/
          cp package.json package-lock.json README.md release/finanzas-os/
          tar -C release -czf "finanzas-os-${release_tag}.tgz" finanzas-os
          sha256sum "finanzas-os-${release_tag}.tgz" > SHA256SUMS.txt
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bundle.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" "finanzas-os-${RELEASE_TAG}.tgz#Finanzas OS runtime bundle" "SHA256SUMS.txt#SHA-256 checksums" --generate-notes
