name: Versioned release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  NODE_VERSION: 26.5.0

jobs:
  release:
    name: Build and publish release asset
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python for synthetic fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check --requirement requirements-ci.txt

      - name: Verify tagged commit is promoted from main
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "Release tag must start with v followed by a number" >&2; exit 1 ;;
          esac
          git fetch origin main --tags --force
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Verify and build
        run: |
          npm run lint
          npm run test:unit
          npm run test:knowledge
          PYTHON=python npm run test:imports
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate mobile and desktop browser journeys
        run: |
          npm run test:e2e -- --project=mobile-chrome
          npm run test:e2e -- --project=desktop-chrome

      - name: Assemble release bundle
        id: bundle
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          release_tag="$RELEASE_TAG"
          case "$release_tag" in v*) ;; *) echo "Release tag must start with v" >&2; exit 1;; esac
          mkdir -p release/finanzas-os
          cp -R dist server public release/finanzas-os/
          cp package.json package-lock.json README.md release/finanzas-os/
          tar -C release -czf "finanzas-os-${release_tag}.tgz" finanzas-os
          sha256sum "finanzas-os-${release_tag}.tgz" > SHA256SUMS.txt
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bundle.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "finanzas-os-${RELEASE_TAG}.tgz#Finanzas OS runtime bundle" "SHA256SUMS.txt#SHA-256 checksums" --clobber
          else
            gh release create "$RELEASE_TAG" "finanzas-os-${RELEASE_TAG}.tgz#Finanzas OS runtime bundle" "SHA256SUMS.txt#SHA-256 checksums" --generate-notes
          fi
