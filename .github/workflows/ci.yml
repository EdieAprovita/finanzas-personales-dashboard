name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_VERSION: 26.5.0

jobs:
  quality:
    name: Quality and synthetic documents
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python for synthetic fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install synthetic-fixture dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-ci.txt

      - name: Verify repository formatting
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Validate knowledge seed
        run: npm run test:knowledge

      - name: Validate synthetic document corpus
        env:
          PYTHON: python
        run: npm run test:imports

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: E2E (${{ matrix.project }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project:
          - mobile-chrome
          - desktop-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser journey
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-${{ github.sha }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
