name: Delivery candidate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  NODE_VERSION: 26.5.0

jobs:
  package:
    name: Package deployable candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: |
          npm run lint
          npm run test:unit
          npm run test:knowledge
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Assemble runtime bundle
        run: |
          mkdir -p release/finanzas-os
          cp -R dist server public release/finanzas-os/
          cp package.json package-lock.json README.md release/finanzas-os/
          tar -C release -czf finanzas-os-${{ github.sha }}.tgz finanzas-os
          sha256sum finanzas-os-${{ github.sha }}.tgz > SHA256SUMS.txt

      - name: Publish immutable delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-os-delivery-${{ github.sha }}
          path: |
            finanzas-os-${{ github.sha }}.tgz
            SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
