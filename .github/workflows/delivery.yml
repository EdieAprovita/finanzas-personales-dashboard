name: Delivery candidate

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  CI: 'true'
  NODE_VERSION: 26.5.0
  DELIVERY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  package:
    name: Package deployable candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the CI-validated commit
        run: npm run build

      - name: Assemble runtime bundle
        run: |
          mkdir -p release/finanzas-os
          cp -R dist server public release/finanzas-os/
          cp package.json package-lock.json README.md release/finanzas-os/
          tar -C release -czf finanzas-os-${DELIVERY_SHA}.tgz finanzas-os
          sha256sum finanzas-os-${DELIVERY_SHA}.tgz > SHA256SUMS.txt

      - name: Publish immutable delivery artifact
        uses: actions/upload-artifact@v7
        with:
          name: finanzas-os-delivery-${{ env.DELIVERY_SHA }}
          path: |
            finanzas-os-${{ env.DELIVERY_SHA }}.tgz
            SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
